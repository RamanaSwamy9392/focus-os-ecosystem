<html>
<head>
<style>
  body { 
    font-family: 'Segoe UI', Arial; 
    background: #0f172a; 
    color: white; 
    padding: 20px; 
    margin: 0;
    transition: 0.5s;
  }
  h1 { text-align: center; color: #38bdf8; }
  #total-box {
    background: #1e293b;
    border: 2px solid #38bdf8;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    margin-bottom: 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  .card {
    background: #1e293b;
    border-radius: 15px;
    padding: 15px;
    border-left: 5px solid #38bdf8;
  }
  .card h3 { margin: 0 0 10px 0; }
  .card p { margin: 5px 0; color: #94a3b8; }
  .card button {
    background: #38bdf8;
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
    width: 100%;
  }
  .card button:hover { background: #0ea5e9; }
  .over { border-left-color: #ef4444 !important; }
</style>
</head>
<body>

<h1>🛡️ Focus Guard</h1>
<div id="total-box">Total Used: <span id="total">0</span> / 240 mins</div>

<div class="grid">

<div class="card" id="card-yt">
  <h3>▶️ YouTube</h3>
  <p>Limit: 100 mins</p>
  <p>Used: <span id="yt-used">0</span> mins</p>
  <button onclick="useApp('youtube', 10)">+10 min</button>
</div>

<div class="card" id="card-insta">
  <h3>📸 Instagram</h3>
  <p>Limit: 80 mins</p>
  <p>Used: <span id="insta-used">0</span> mins</p>
  <button onclick="useApp('instagram', 10)">+10 min</button>
</div>

<div class="card" id="card-snap">
  <h3>👻 Snapchat</h3>
  <p>Limit: 30 mins</p>
  <p>Used: <span id="snap-used">0</span> mins</p>
  <button onclick="useApp('snapchat', 10)">+10 min</button>
</div>

<div class="card" id="card-wa">
  <h3>💬 WhatsApp</h3>
  <p>Limit: 30 mins</p>
  <p>Used: <span id="wa-used">0</span> mins</p>
  <button onclick="useApp('whatsapp', 10)">+10 min</button>
</div>

</div>

<script>
let total = 0;
function useApp(app, mins) {
  total = total + mins;
  document.getElementById('total').innerText = total;

  if(app === 'youtube') {
    let old = document.getElementById('yt-used').innerText;
    document.getElementById('yt-used').innerText = Number(old) + mins;
    if(Number(old)+mins > 100) document.getElementById('card-yt').classList.add('over');
  }
  if(app === 'instagram') {
    let old = document.getElementById('insta-used').innerText;
    document.getElementById('insta-used').innerText = Number(old) + mins;
    if(Number(old)+mins > 80) document.getElementById('card-insta').classList.add('over');
  }
  if(app === 'snapchat') {
    let old = document.getElementById('snap-used').innerText;
    document.getElementById('snap-used').innerText = Number(old) + mins;
  }
  if(app === 'whatsapp') {
    let old = document.getElementById('wa-used').innerText;
    document.getElementById('wa-used').innerText = Number(old) + mins;
  }

  if(total >= 240) {
    document.body.style.background = "#7f1d1d";
    alert("🚨 STOP! 4 Hours Over! Focus Time!");
  }
}
</script>

</body>
</html>
